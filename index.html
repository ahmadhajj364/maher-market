:root {

  --surface: #ffffff;
  --sunken: #eceee9;
  --line: #d9ddd5;
  --ink: #1c231f;
  --muted: #5f6a63;
  --accent: #0f6b55;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --warn: #9a5b00;

  --bad: #b3261e;

  --good: #1d7a3c;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* market colours: a soft tint + a matching ink for each */
  --band: #0e5a44; --band-ink: #ffffff; --band-muted: rgba(255,255,255,.72);
  --t-green: #dcf2e6; --i-green: #0f6b48;  --t-blue: #dfeafb; --i-blue: #1f5aa8;
  --t-purple: #ebe5fb; --i-purple: #5a3eae; --t-amber: #fcedd0; --i-amber: #8a5600;
  --t-coral: #fde1d9; --i-coral: #b23d26;  --t-teal: #d6f1f0; --i-teal: #0c6b6b;
  --t-pink: #fbe1ee; --i-pink: #a02a66;    --t-olive: #ebf0d3; --i-olive: #586611;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accent: #3fbf97; --accent-ink: #08140f; --accent-soft: #173a2f; --warn: #e8b04f; --warn-soft: #3a2c12;

  --t-green: #163a2b; --i-green: #7ed8aa; --t-blue: #1a2b44; --i-blue: #92b9f2; --t-purple: #2a2342; --i-purple: #baa8f6; --t-amber: #3a2b11; --i-amber: #f1c272;
  --t-coral: #3e2019; --i-coral: #f4a18d; --t-teal: #113534; --i-teal: #7fd7d5; --t-pink: #3b1c2b; --i-pink: #f2a3c9; --t-olive: #2b3014; --i-olive: #c7d47c; color-scheme: dark } }

  --t-green: #163a2b; --i-green: #7ed8aa; --t-blue: #1a2b44; --i-blue: #92b9f2; --t-purple: #2a2342; --i-purple: #baa8f6; --t-amber: #3a2b11; --i-amber: #f1c272;
  --t-coral: #3e2019; --i-coral: #f4a18d; --t-teal: #113534; --i-teal: #7fd7d5; --t-pink: #3b1c2b; --i-pink: #f2a3c9; --t-olive: #2b3014; --i-olive: #c7d47c; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .01em; margin-inline-end: auto; }
.brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.rate { font-family: var(--mono); font-size: 13px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
nav.tabs button { flex: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 8px 12px; border-radius: var(--r); cursor: pointer; position: relative; }
nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav.tabs .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-inline-start: 6px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-family: var(--mono); }
main { padding-block: 16px 48px; }
h2 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 16px; margin: 0 0 8px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], input[type=date], input[type=search], input[type=tel], select {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 10px; min-width: 0; width: 100%; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
label.f.chk { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sunken); }
[dir=rtl] th { text-transform: none; letter-spacing: 0; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: end; }
td.wrapc { white-space: normal; min-width: 160px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.ex { background: var(--sunken); color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.kpi b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 600; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi em { font-style: normal; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }

/* Till */
.till { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .till { grid-template-columns: minmax(0, 1fr); } }
.search-big { font-size: 18px !important; padding: 12px 14px !important; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
.item { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px; cursor: pointer; display: grid; gap: 2px; min-height: 78px; }
.item:hover { border-color: var(--accent); }
.item .nm { font-weight: 600; line-height: 1.25; }
.item .pr { font-family: var(--mono); color: var(--accent); font-weight: 600; }
.item .st { font-size: 12px; color: var(--muted); }
.item.weighed { background: var(--accent-soft); }
.item.out { opacity: .55; }
.receipt { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 110px); }
.cart-line { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.cart-line .q { display: flex; gap: 4px; align-items: center; }
.cart-line .q button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0 4px; }
.total b { font-family: var(--mono); font-size: 26px; }
.total .lbp { font-family: var(--mono); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.change { font-family: var(--mono); font-size: 15px; padding: 8px 10px; background: var(--sunken); border-radius: var(--r); }
.receipt-paper { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; background: var(--sunken); padding: 12px; border-radius: var(--r); }

.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.drawer { position: fixed; z-index: 21; inset-block: 0; inset-inline-end: 0; width: min(460px, 100%); background: var(--surface); padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) 16px; overflow-y: auto; border-inline-start: 1px solid var(--line); }
.drawer .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.toast { position: fixed; z-index: 30; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 600; }
[dir=rtl] .toast { transform: translateX(50%); }
.muted { color: var(--muted); }
/* colour layer */
body::before { background: var(--band); }
header.top { background: var(--band); border-bottom: 0; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.brand { color: var(--band-ink); }
.brand small, .rate { color: var(--band-muted); }
#langBtn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: var(--band-ink); }
nav.tabs button { color: var(--band-muted); }
nav.tabs button:hover { color: var(--band-ink); background: rgba(255,255,255,.08); }
nav.tabs button[aria-current="page"] { background: var(--tint); color: var(--ink); }
nav.tabs button[data-tab=till], main[data-tab=till] { --tint: var(--t-green); --ink: var(--i-green); }
nav.tabs button[data-tab=stock], main[data-tab=stock] { --tint: var(--t-blue); --ink: var(--i-blue); }
nav.tabs button[data-tab=suppliers], main[data-tab=suppliers] { --tint: var(--t-purple); --ink: var(--i-purple); }
nav.tabs button[data-tab=boxes], main[data-tab=boxes] { --tint: var(--t-amber); --ink: var(--i-amber); }
nav.tabs button[data-tab=customers], main[data-tab=customers] { --tint: var(--t-coral); --ink: var(--i-coral); }
nav.tabs button[data-tab=payments], main[data-tab=payments] { --tint: var(--t-teal); --ink: var(--i-teal); }
nav.tabs button[data-tab=today], main[data-tab=today] { --tint: var(--t-pink); --ink: var(--i-pink); }
nav.tabs button[data-tab=settings], main[data-tab=settings] { --tint: var(--sunken); --ink: var(--ink); }
main h2 { color: var(--ink); }
main .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
main[data-tab=till] .btn.primary, main[data-tab=settings] .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
main .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
main th { background: var(--tint); color: var(--ink); }
.tinted { background: var(--tint) !important; border-color: transparent !important; }
.tinted .nm { color: var(--ink); }
.item.tinted:hover { border-color: var(--ink) !important; }
.cat-h { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.cat-h .muted { color: var(--ink); opacity: .7; }
.kpis .kpi:nth-child(4n+1) { background: var(--t-green); border-color: transparent; } .kpis .kpi:nth-child(4n+1) b { color: var(--i-green); }
.kpis .kpi:nth-child(4n+2) { background: var(--t-blue); border-color: transparent; } .kpis .kpi:nth-child(4n+2) b { color: var(--i-blue); }
.kpis .kpi:nth-child(4n+3) { background: var(--t-amber); border-color: transparent; } .kpis .kpi:nth-child(4n+3) b { color: var(--i-amber); }
.kpis .kpi:nth-child(4n+4) { background: var(--t-purple); border-color: transparent; } .kpis .kpi:nth-child(4n+4) b { color: var(--i-purple); }
.receipt { border-top: 4px solid var(--i-green); }
.total b { color: var(--i-green); }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; text-align: start; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
tr.clickrow { cursor: pointer; } tr.clickrow:hover td { background: var(--tint, var(--sunken)); }
.linkbtn:hover { color: var(--accent); text-decoration-color: currentColor; }
a { color: var(--accent); }
.sup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; align-items: start; }
.lines { display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .item, .btn { transition: border-color .12s; } }
</style>

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) ? n : d; };
const usd = (n) => "$" + (Math.round(num(n) * 100) / 100).toFixed(2);
const roundLbp = (n) => Math.round(num(n) / 1000) * 1000;
const lbp = (n) => roundLbp(n).toLocaleString("en-US") + " LBP";
const toLbp = (u) => u * S.settings.rate;
const dateKey = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const addDays = (key, n) => { const d = new Date(key + "T12:00:00"); d.setDate(d.getDate() + n); return dateKey(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const timeStr = (iso) => new Date(iso).toLocaleTimeString(lang === "ar" ? "ar-LB" : "en-GB", { hour: "2-digit", minute: "2-digit" });
const pname = (p) => (lang === "ar" ? (p.nameAr || p.name) : (p.name || p.nameAr)) || "—";
const boxSize = (p) => Math.max(1, Math.round(num(p.boxSize, 1)));
const totalOf = (p) => num(p.shelf) + num(p.openBox) + num(p.closed) * boxSize(p);
const isReorder = (p) => !p.weighed && totalOf(p) <= num(p.reorder);
const needsRefill = (p) => !p.weighed && boxSize(p) > 1 && num(p.shelf) <= num(S.settings.shelfMin) && (num(p.openBox) + num(p.closed)) > 0;
const supOf = (p) => (p && p.supplierId && S.suppliers.get(p.supplierId)) || null;
const telLink = (n) => n ? `<a class="mono" href="tel:${esc(String(n).replace(/[^0-9+]/g, ""))}">${esc(n)}</a>` : "";
// Each open tab is one till. It is the only writer of its own counters, so two tills never overwrite each other.
const DEV = (() => { try { let d = sessionStorage.getItem("maher-dev"); if (!d) { d = "t" + uid(); sessionStorage.setItem("maher-dev", d); } return d; } catch (e) { return "t" + uid(); } })();
const entriesOf = (c) => (Array.isArray(c.entries) ? c.entries : Object.values(c.entries || {})).slice().sort((a, b) => String(a.at).localeCompare(String(b.at)));
// Entries are keyed by id and merged in, so two people adding to one account at once both count.
function addEntry(c, e) {
  const eid = uid(); const add = { [eid]: e };
  if (Array.isArray(c.entries) && c.entries.length) { const all = {}; c.entries.forEach((x, i) => (all["old" + i] = x)); return S.db.doc("customers/" + c.id).update({ entries: { ...all, ...add } }); }
  return S.db.doc("customers/" + c.id).update({ entries: add });
}
// A stock action writes the shelf / open box / closed boxes as they are now and marks every sale so far as counted in.
const stockBase = (p, changes) => ({ shelf: num(p.shelf), openBox: num(p.openBox), closed: num(p.closed), soldBase: num(p._soldTotal), ...changes });
const isStaff = (c) => c.kind === "staff";
const isLate = (c) => { if (isStaff(c)) return false; const s = unpaidSince(c); return !!s && daysBetween(s, dateKey()) > 7; };
const balanceOf = (c) => entriesOf(c).reduce((s, e) => s + (e.type === "sale" ? num(e.amount) : -num(e.amount)), 0);
const unpaidSince = (c) => {
  let bal = 0, start = null;
  for (const e of entriesOf(c)) {
    bal += e.type === "sale" ? num(e.amount) : -num(e.amount);
    if (bal <= 0.004) start = null; else if (!start) start = e.at.slice(0, 10);
  }
  return start;
};
let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2200); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
async function write(fn, okMsg) {
  if (!S.db) { toast(t("noDb")); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    console.error(e);
    if (e && e.code === "invalid_argument") { S.canWrite = false; render(); toast(t("readOnly")); }
    else if (e && e.code === "unavailable") { toast("Connection problem. Try again."); }
    else toast((e && e.message) || "Could not save");
    return false;
  }
}

// ---------- stock movements ----------
function takeFromStock(p, qty) {
  let shelf = num(p.shelf), open = num(p.openBox), closed = num(p.closed); const bs = boxSize(p);
  let need = qty;
  const fromShelf = Math.min(shelf, need); shelf -= fromShelf; need -= fromShelf;
  while (need > 0) {
    if (open <= 0 && closed > 0) { closed -= 1; open += bs; }
    if (open <= 0) { shelf -= need; need = 0; break; } // sold more than recorded: shelf goes negative so the count shows it
    const fromOpen = Math.min(open, need); open -= fromOpen; need -= fromOpen;
  }
  return { shelf, openBox: open, closed };
}

}

// Update the page in place instead of rebuilding it, so a button under the cashier's finger
// stays the same button while other tills' sales arrive.
function morphNode(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b.cloneNode(true)); return; }
  if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name) && at.name !== "data-typed") a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  const tag = a.nodeName;
  if (tag === "INPUT") {
    if (a.type === "checkbox") { if (a !== document.activeElement) a.checked = b.hasAttribute("checked"); }
    else if (b.hasAttribute("value") && a !== document.activeElement && a.value !== b.getAttribute("value") && !a.dataset.typed) a.value = b.getAttribute("value");
    if (a.disabled !== b.hasAttribute("disabled")) a.disabled = b.hasAttribute("disabled");
    return;
  }
  if (tag === "BUTTON" && a.disabled !== b.hasAttribute("disabled")) a.disabled = b.hasAttribute("disabled");
  morphChildren(a, b);
  if (tag === "SELECT" && a !== document.activeElement) { const sel = b.querySelector("option[selected]"); if (sel) a.value = sel.value; }
}
function morphChildren(a, b) {
  const bk = [...b.childNodes];
  bk.forEach((bn, i) => { const an = a.childNodes[i]; if (an) morphNode(an, bn); else a.appendChild(bn.cloneNode(true)); });
  while (a.childNodes.length > bk.length) a.lastChild.remove();
}
function morph(el, html) { const tpl = document.createElement("template"); tpl.innerHTML = html; morphChildren(el, tpl.content); }
// Live updates from other devices are bundled into at most one redraw every 150 ms.
let renderTimer = null;
function scheduleRender() { if (renderTimer) return; renderTimer = setTimeout(() => { renderTimer = null; render(); }, 150); }

function render() {
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  renderHeader();
  const main = $("#main");
  // keep typed values and focus across live updates
  const active = document.activeElement && document.activeElement.id;
  const selStart = active && document.activeElement.selectionStart;
  const vals = {}; main.querySelectorAll("input[id],select[id]").forEach((el) => { vals[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  let html = "";
  if (!S.ready) html = `<div class="empty">${esc(S.failed ? t("noDb") : t("loading"))}</div>`;
  else html = (!S.canWrite ? `<p class="banner">${esc(t("readOnly"))}</p><br>` : "") + VIEWS[S.tab]();
  main.dataset.tab = S.tab;
  if (main.dataset.shown !== S.tab) { main.innerHTML = html; main.dataset.shown = S.tab; } else morph(main, html);
  main.querySelectorAll("input[id],select[id]").forEach((el) => {
    if (el.dataset.fresh) return;
    if (el.id in vals) { if (el.type === "checkbox") el.checked = vals[el.id]; else el.value = vals[el.id]; }
  });
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
}

const VIEWS = {};

// Till
VIEWS.till = () => {
  const prods = [...S.products.values()];
  if (!prods.length) return `<div class="panel empty">${esc(t("noProducts"))}</div>`;
  const q = S.q.trim().toLowerCase();
  const match = (p) => !q || (p.name || "").toLowerCase().includes(q) || (p.nameAr || "").includes(S.q.trim()) || (p.barcode || "").includes(q);
  const weighed = prods.filter((p) => p.weighed && match(p)).sort((a, b) => pname(a).localeCompare(pname(b)));
  const normal = prods.filter((p) => !p.weighed && match(p)).sort((a, b) => pname(a).localeCompare(pname(b))).slice(0, 60);
  const tile = (p) => {
    const tot = totalOf(p);
    return `<button class="item ${p.weighed ? "weighed" : ""} ${!p.weighed && tot <= 0 ? "out" : ""} ${tintOf(p.category) ? "tinted" : ""}" ${tintStyle(p.category)} data-act="addItem" data-id="${esc(p.id)}">
      <span class="nm">${esc(pname(p))}</span>
      ${p.weighed ? "" : `<span class="pr">${usd(p.price)}</span>`}
      <span class="st">${p.weighed ? "" : (tot <= 0 ? esc(t("out")) : `${tot} ${esc(t("inStock"))}`)}${p.example ? ` · ${esc(t("example"))}` : ""}</span></button>`;
  };
  return `<div class="till">
    <section>
      <input type="search" id="tillSearch" class="search-big" placeholder="${esc(t("scan"))}" autocomplete="off" data-in="q">
      ${weighedGroups(weighed, tile)}
      <h3 style="margin-top:16px">${esc(t("allItems"))}</h3>
      <div class="items">${normal.map(tile).join("") || `<div class="muted">—</div>`}</div>
    </section>
    <aside class="panel receipt">${S.lastReceipt ? receiptView() : cartView()}</aside>
  </div>`;
};

const WEIGH_CATS = ["Spices · بهارات", "Fridge: cheese & labneh · البراد: أجبان ولبنة", "Olives & pickles · زيتون ومكدوس ومخللات"];
const SHELF_CATS = ["Cleaning supplies · مواد تنظيف", "Canned food · معلبات", "Chocolate & candy · شوكولا وسكاكر", "Snacks & chips · سناكات وشيبس",
  "Drinks · مشروبات", "Rice, sugar & pantry · حبوب وسكر وتموين", "Pasta & sauces · معكرونة وصلصات", "Oil & ghee · زيت وسمنة", "Coffee & tea · قهوة وشاي",
  "Dairy & eggs · ألبان وبيض", "Bread & bakery · خبز ومخبوزات", "Personal care · عناية شخصية", "Baby · أطفال", "Paper & plastic · ورق وبلاستيك"];
const shelfCatKey = (p) => (p.category && !WEIGH_CATS.includes(p.category) ? p.category : "");
function shelfGroups(items) {
  const g = new Map(); items.forEach((p) => { const k = shelfCatKey(p); if (!g.has(k)) g.set(k, []); g.get(k).push(p); });
  const idx = (k) => { const i = SHELF_CATS.indexOf(k); return k === "" ? 999 : i < 0 ? 500 : i; };
  return [...g.keys()].sort((a, b) => idx(a) - idx(b) || a.localeCompare(b)).map((k) => ({ key: k, label: k ? catLabel(k) : t("shelfOther"), items: g.get(k) }));
}
function sectionKey(p) { if (!p.weighed) return "shelf"; return WEIGH_CATS.includes(p.category) ? p.category : "other"; }
function sectionsOf(prods) {
  const out = [{ key: "shelf", label: t("secShelf") }, ...WEIGH_CATS.map((c) => ({ key: c, label: catLabel(c) }))];
  if (prods.some((p) => sectionKey(p) === "other")) out.push({ key: "other", label: t("secOther") });
  return out.map((x) => ({ ...x, n: prods.filter((p) => sectionKey(p) === x.key).length }));
}
const TINTS = ["green", "blue", "purple", "amber", "coral", "teal", "pink", "olive"];
const WEIGH_TINT = { 0: "amber", 1: "blue", 2: "olive" };
function tintOf(cat) {

const tintStyle = (cat) => { const k = tintOf(cat); return k ? `style="--tint:var(--t-${k});--ink:var(--i-${k})"` : ""; };
function catLabel(c) { const parts = String(c || "").split(" · "); return parts.length === 2 ? (lang === "ar" ? parts[1] : parts[0]) : (c || t("fresh")); }
function weighedGroups(list, tile) {

}

// Payments
VIEWS.payments = () => {
  const today = dateKey(); const in7 = addDays(today, 7); const in30 = addDays(today, 30);
  const all = [...S.payments.values()];
  const up = all.filter((p) => !p.paidAt).sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
  const done = all.filter((p) => p.paidAt).sort((a, b) => b.paidAt.localeCompare(a.paidAt));
  const inUsd = (p) => p.currency === "LBP" ? num(p.amount) / S.settings.rate : num(p.amount);
  const sumTo = (d) => up.filter((p) => p.due && p.due <= d).reduce((s, p) => s + inUsd(p), 0);
  const amt = (p) => p.currency === "LBP" ? lbp(p.amount) : usd(p.amount);

// Today
function daySummary(key) {
  const rs = [];
  for (const d of S.days.values()) if (d.date === key) rs.push(...(Array.isArray(d.receipts) ? d.receipts : Object.values(d.receipts || {})));
  rs.sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const sales = rs.reduce((s, r) => s + num(r.total), 0);
  const credit = rs.filter((r) => r.method === "credit").reduce((s, r) => s + num(r.total), 0);
  return { rs, sales, credit, cash: sales - credit, n: rs.length, avg: rs.length ? sales / rs.length : 0 };
}
VIEWS.today = () => {
  const today = dateKey(); const td = daySummary(today); const lw = daySummary(addDays(today, -7));
  const prods = [...S.products.values()];
  const top = new Map();
  td.rs.forEach((r) => r.items.forEach((l) => { const k = l.pid; const x = top.get(k) || { name: l.name, qty: 0, amt: 0 }; x.qty += l.weighed ? 0 : l.qty; x.amt += l.qty * l.price; top.set(k, x); }));
  const topList = [...top.values()].sort((a, b) => b.amt - a.amt).slice(0, 8);
  const late = [...S.customers.values()].filter(isLate).length;
  const dueW = [...S.payments.values()].filter((p) => !p.paidAt && p.due && p.due <= addDays(today, 7)).length;
  const alerts = [[prods.filter(isReorder).length, t("a_reorder"), "stock"], [prods.filter(needsRefill).length, t("a_refill"), "boxes"], [late, t("a_late"), "customers"], [dueW, t("a_due"), "payments"]].filter((a) => a[0] > 0);
  const cmp = (a, b) => b ? `${t("lastWeek")}: ${usd(b)}` : "";
  const week = Array.from({ length: 7 }, (_, i) => addDays(today, -6 + i)).map((k) => ({ k, ...daySummary(k) }));
  const max = Math.max(1, ...week.map((w) => w.sales));
  const bars = week.map((w, i) => { const h = Math.round((w.sales / max) * 100); const x = 20 + i * 48;
    return `<g><rect x="${x}" y="${120 - h}" width="30" height="${Math.max(h, 1)}" rx="3" fill="${w.k === today ? "var(--accent)" : "var(--line)"}"></rect>
      <text x="${x + 15}" y="${114 - h}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${w.sales ? Math.round(w.sales) : ""}</text>
      <text x="${x + 15}" y="136" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${w.k.slice(5)}</text></g>`; }).join("");
  return `<div class="stack"><div><h2>${esc(t("tab_today"))}</h2><p class="sub">${esc(today)}</p></div>
    <div class="kpis">
      <div class="kpi"><span>${esc(t("sales"))}</span><b>${usd(td.sales)}</b><em>${esc(cmp(td.sales, lw.sales))}</em></div>
      <div class="kpi"><span>${esc(t("receipts"))}</span><b>${td.n}</b><em>${lw.n ? esc(t("lastWeek")) + ": " + lw.n : ""}</em></div>
      <div class="kpi"><span>${esc(t("avgBasket"))}</span><b>${usd(td.avg)}</b><em>${esc(cmp(td.avg, lw.avg))}</em></div>
      <div class="kpi"><span>${esc(t("creditSales"))}</span><b>${usd(td.credit)}</b><em>${esc(t("cashTaken"))}: ${usd(td.cash)}</em></div>
    </div>
    ${alerts.length ? `<div class="panel"><h3>${esc(t("alerts"))}</h3><div class="row">${alerts.map((a) => `<button class="btn" data-act="tab" data-tab="${a[2]}"><span class="pill warn">${a[0]}</span> ${esc(a[1])}</button>`).join("")}</div></div>` : ""}
    <div class="panel"><h3>${esc(t("last7"))} ($)</h3><div style="overflow-x:auto"><svg viewBox="0 0 356 142" width="100%" style="max-width:520px" role="img" aria-label="${esc(t("last7"))}">${bars}</svg></div></div>
    <div class="panel"><h3>${esc(t("topItems"))}</h3>${topList.length ? `<div class="tbl"><table><thead><tr><th>${esc(t("item"))}</th><th class="n">${esc(t("qty"))}</th><th class="n">${esc(t("sales"))}</th></tr></thead><tbody>

  </div>`;
};

  const p = id ? S.payments.get(id) : { currency: "USD", due: dateKey() };
  drawer(id ? t("addPay") : t("addPay"), `<form id="paymentForm" class="stack" data-id="${esc(id || "")}"><div class="grid-form">
    <label class="f">${esc(t("to"))}<input type="text" id="py-to" required value="${esc(p.to || "")}"></label>
    <label class="f">${esc(t("what"))}<input type="text" id="py-what" value="${esc(p.what || "")}"></label>
    <label class="f">${esc(t("amount"))}<input type="number" id="py-amount" min="0" step="any" required value="${esc(p.amount ?? "")}"></label>
    <label class="f">${esc(t("currency"))}<select id="py-cur"><option value="USD" ${p.currency === "USD" ? "selected" : ""}>$</option><option value="LBP" ${p.currency === "LBP" ? "selected" : ""}>LBP</option></select></label>
    <label class="f">${esc(t("due"))}<input type="date" id="py-due" value="${esc(p.due || "")}"></label></div>
    <div class="row"><button class="btn primary" type="submit">${esc(t("save"))}</button><button class="btn" type="button" data-act="closeDrawer">${esc(t("cancel"))}</button>
    <span class="spacer"></span>${id ? `<button class="btn danger" type="button" data-act="delPayment" data-id="${esc(id)}">${esc(t("del"))}</button>` : ""}</div></form>`);
}

// ---------- actions ----------
function addToCart(p) {
  if (p.weighed) { S.weighPending = p.id; S.lastReceipt = null; render(); setTimeout(() => { const el = $("#weighPrice"); if (el) el.focus(); }, 0); return; }
  S.lastReceipt = null;
  const line = S.cart.find((l) => l.pid === p.id && !l.weighed);
  if (line) line.qty += 1; else S.cart.push({ pid: p.id, name: pname(p), qty: 1, price: num(p.price), cost: num(p.cost), weighed: false });
  render();
}

async function finishSale() {
  if (S.busy || !S.cart.length) return;
  S.busy = true; render();
  const tot = Math.round(cartTotal() * 100) / 100;
  const now = new Date(); const day = dateKey(now); const at = now.toISOString();
  // one sales document per till per hour: small documents, and no two tills write the same one
  const ref = S.db.doc("sales/" + day + "_" + String(now.getHours()).padStart(2, "0") + "_" + DEV);
  const paidUsd = num(S.pay.usd), paidLbp = num(S.pay.lbp);
  const paidTotal = paidUsd + paidLbp / S.settings.rate;
  const rid = uid();
  const r = { id: rid, no: daySummary(day).n + 1, at, day, till: DEV, items: S.cart.map((l) => ({ ...l })), total: tot, method: S.pay.method,
    customerId: S.pay.method === "credit" ? S.pay.customer : null, paidUsd, paidLbp,
    changeUsd: S.pay.method === "cash" && paidTotal > 0 ? Math.max(0, paidTotal - tot) : 0, rate: S.settings.rate, vat: S.settings.vat };
  const ok = await write(async () => {
    const jobs = [ref.update({ receipts: { [rid]: r } }).catch((e) => { if (e && e.code === "invalid_argument") return ref.set({ date: day, till: DEV, receipts: { [rid]: r } }); throw e; })];
    const qtyBy = new Map(); r.items.forEach((l) => { if (!l.weighed) qtyBy.set(l.pid, (qtyBy.get(l.pid) || 0) + l.qty); });
    for (const [pid, q] of qtyBy) { const p = S.products.get(pid); if (p) jobs.push(S.db.doc("products/" + pid).update({ soldBy: { [DEV]: num(p._mine) + q } })); }
    if (r.customerId) { const c = S.customers.get(r.customerId); if (c) jobs.push(addEntry(c, { at, type: "sale", amount: tot, note: "#" + r.no })); }
    await Promise.all(jobs);
  }, t("saleDone"));
  S.busy = false;
  if (ok) { S.lastReceipt = r; S.cart = []; S.pay = { method: "cash", usd: "", lbp: "", customer: "" }; S.weighPending = null; }
  render(); const sb = $("#tillSearch"); if (sb) sb.focus();
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) { const row = ev.target.closest("tr[data-row]"); if (row && !ev.target.closest("input,select,a")) productInfoDrawer(row.dataset.row); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "tab") { S.tab = el.dataset.tab; try { history.replaceState(null, "", "#" + S.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (a === "lang") { lang = lang === "en" ? "ar" : "en"; try { localStorage.setItem("maher-lang", lang); } catch (e) {} render(); return; }
  if (a === "closeDrawer") { closeDrawer(); return; }
  if (a === "addItem") { const p = S.products.get(id); if (p) addToCart(p); return; }
  if (a === "qty") { const l = S.cart[+el.dataset.i]; l.qty = Math.max(1, l.qty + +el.dataset.d); render(); return; }
  if (a === "rmLine") { S.cart.splice(+el.dataset.i, 1); render(); return; }
  if (a === "clearCart") { S.cart = []; S.weighPending = null; S.pay = { method: "cash", usd: "", lbp: "", customer: "" }; render(); return; }
  if (a === "method") { S.pay.method = el.dataset.m; render(); return; }
  if (a === "weighCancel") { S.weighPending = null; render(); return; }
  if (a === "weighAdd") {
    const v = num($("#weighPrice").value); if (v <= 0) return;
    const p = S.products.get(S.weighPending); const priceUsd = $("#weighCur").value === "lbp" ? v / S.settings.rate : v;
    S.cart.push({ pid: p.id, name: pname(p), qty: 1, price: Math.round(priceUsd * 10000) / 10000, cost: 0, weighed: true });
    S.weighPending = null; render(); const s = $("#tillSearch"); if (s) s.focus(); return;
  }
  if (a === "finish") { await finishSale(); return; }
  if (a === "newSale") { S.lastReceipt = null; render(); const s = $("#tillSearch"); if (s) s.focus(); return; }
  if (a === "openProduct") { productDrawer(id, el.dataset.sec, el.dataset.cat); return; }
  if (a === "stockSec") { S.stockSec = el.dataset.v; S.shelfCat = "all"; render(); return; }
  if (a === "shelfCat") { S.shelfCat = el.dataset.v; render(); return; }
  if (a === "productInfo") { productInfoDrawer(id); return; }
  if (a === "linkSupplier") { const sel = $("#pi-sup"); if (sel && sel.value && await write(() => S.db.doc("products/" + id).update({ supplierId: sel.value }), t("linked")) && $("#overlay").innerHTML) productInfoDrawer(id); return; }
  if (a === "unlinkSupplier") { const p = S.products.get(id); drawer(pname(p), supplierPicker(p)); return; }
  if (a === "openSupplier") { supplierDrawer(id); return; }
  if (a === "copyText") { try { await navigator.clipboard.writeText(el.dataset.text); toast(t("copied")); } catch (e) { toast(el.dataset.text); } return; }
  if (a === "delSupplier") {
    if ([...S.products.values()].some((p) => p.supplierId === id)) { toast(t("delSupBlocked")); return; }
    if (delArmed !== id) { delArmed = id; el.textContent = t("confirmDel"); return; }
    if (await write(() => S.db.doc("suppliers/" + id).delete())) closeDrawer(); return;
  }
  if (a === "openReceive") { receiveDrawer(id); return; }
  if (a === "openCount") { countDrawer(id); return; }
  if (a === "delProduct") {
    if (delArmed !== id) { delArmed = id; el.textContent = t("confirmDel"); return; }
    if (await write(() => S.db.doc("products/" + id).delete())) closeDrawer(); return;
  }
  if (a === "removeExamples") {
    const ex = [...S.products.values()].filter((p) => p.example);
    await write(async () => { for (const p of ex) await S.db.doc("products/" + p.id).delete(); }, t("examplesGone")); return;
  }
  if (a === "openBoxNow") { const p = S.products.get(id); if (num(p.closed) > 0) await write(() => S.db.doc("products/" + id).update(stockBase(p, { closed: num(p.closed) - 1, openBox: num(p.openBox) + boxSize(p) })), t("opened")); return; }
  if (a === "toShelf") {
    const p = S.products.get(id); const inp = document.getElementById("mv-" + id);
    const n = Math.min(num(p.openBox), inp && inp.value ? Math.round(num(inp.value)) : num(p.openBox)); if (n <= 0) return;
    if (inp) inp.value = "";
    await write(() => S.db.doc("products/" + id).update(stockBase(p, { openBox: num(p.openBox) - n, shelf: num(p.shelf) + n })), t("moved")); return;
  }
  if (a === "openNewCustomer") { customerNewDrawer(el.dataset.kind); return; }
  if (a === "openAddDebt") { addDebtDrawer(id); return; }
  if (a === "debtTab") { S.debtTab = el.dataset.v; render(); return; }
  if (a === "openCustomer") { customerDrawer(id); return; }
  if (a === "openCustomerPay") { customerPayDrawer(id); return; }
  if (a === "delCustomer") {
    if (delArmed !== id) { delArmed = id; el.textContent = t("confirmDel"); return; }
    if (await write(() => S.db.doc("customers/" + id).delete())) closeDrawer(); return;
  }
  if (a === "copyReminder") {
    const c = S.customers.get(id); const msg = T[lang].reminder(c.name, `${usd(balanceOf(c))} (${lbp(toLbp(balanceOf(c)))})`);
    try { await navigator.clipboard.writeText(msg); toast(t("copied")); } catch (e) { drawer(t("copyReminder"), `<textarea style="width:100%;min-height:120px" id="remText">${esc(msg)}</textarea><p class="muted mono">${esc(c.phone || "")}</p>`); const ta = $("#remText"); ta.focus(); ta.select(); }
    return;
  }
  if (a === "payTab") { S.payTab = el.dataset.v; render(); return; }
  if (a === "openPayment") { paymentDrawer(id); return; }
  if (a === "markPaid") { const m = document.getElementById("pm-" + id); await write(() => S.db.doc("payments/" + id).update({ paidAt: new Date().toISOString(), method: m ? m.value : "till" }), t("saved")); return; }
  if (a === "delPayment") {
    if (delArmed !== id) { delArmed = id; el.textContent = t("confirmDel"); return; }
    if (await write(() => S.db.doc("payments/" + id).delete())) closeDrawer(); return;
  }
  if (a === "saveSettings") {
    const s = { rate: Math.max(1, num($("#setRate").value, S.settings.rate)), vat: Math.max(0, num($("#setVat").value, S.settings.vat)), shelfMin: Math.max(0, num($("#setShelf").value, S.settings.shelfMin)) };
    await write(() => S.db.doc("settings/main").set(s), t("saved")); return;
  }
});

document.addEventListener("input", (ev) => {
  if (ev.target && ev.target.dataset) ev.target.dataset.typed = "1";
  const k = ev.target.dataset && ev.target.dataset.in; if (!k) return;
  if (k === "q") { S.q = ev.target.value; render(); }
  else if (k === "stockQ") { S.stockQ = ev.target.value; render(); }
  else if (k.startsWith("pay.")) { S.pay[k.slice(4)] = ev.target.value; render(); }
});
document.addEventListener("change", (ev) => { if (ev.target.id === "payCustomer") { S.pay.customer = ev.target.value; render(); } });

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && $("#overlay").innerHTML) { closeDrawer(); return; }
  if (ev.key !== "Enter") return;
  if (ev.target.id === "tillSearch") {
    ev.preventDefault();
    const v = ev.target.value.trim(); if (!v) return;
    const prods = [...S.products.values()];
    let p = prods.find((x) => x.barcode && x.barcode === v);
    if (!p) { const ql = v.toLowerCase(); const m = prods.filter((x) => (x.name || "").toLowerCase().includes(ql) || (x.nameAr || "").includes(v)); if (m.length === 1) p = m[0]; }
    if (p) { S.q = ""; ev.target.value = ""; addToCart(p); } else toast(t("notFound"));
  } else if (ev.target.id === "weighPrice") { ev.preventDefault(); const b = document.querySelector('[data-act="weighAdd"]'); if (b) b.click(); }
});

document.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target; const id = f.dataset.id;
  const v = (s) => (f.querySelector(s) || {}).value;
  if (f.id === "productForm") {
    const data = { name: v("#pf-name").trim(), nameAr: v("#pf-nameAr").trim(), barcode: v("#pf-barcode").trim(), category: v("#pf-category").trim(),
      price: num(v("#pf-price")), cost: num(v("#pf-cost")), boxSize: Math.max(1, Math.round(num(v("#pf-boxSize"), 1))), reorder: Math.max(0, Math.round(num(v("#pf-reorder")))),
      weighed: f.querySelector("#pf-weighed").checked, supplierId: v("#pf-supplier") || null };
    if (!data.name && !data.nameAr) { f.querySelector("#pf-nameAr").focus(); return; }
    if (data.barcode && [...S.products.values()].some((p) => p.barcode === data.barcode && p.id !== id)) { toast(t("barcode") + " ✕"); return; }
    if (await write(async () => {
      if (id) { await S.db.doc("products/" + id).update({ ...data, example: false }); }
      else { const nid = uid(); await S.db.doc("products/" + nid).set({ id: nid, ...data, shelf: 0, openBox: 0, closed: 0, soldBase: 0, createdAt: new Date().toISOString() }); }
    }, t("saved"))) closeDrawer();
  }
  if (f.id === "quickSupForm") {
    const name = v("#qs-name").trim(); if (!name) return; const nid = uid();
    const data = { id: nid, name, phone: v("#qs-phone").trim(), phone2: "", independent: v("#qs-type") === "alone", company: v("#qs-company").trim(), visits: "", address: "", notes: "", createdAt: new Date().toISOString() };
    if (await write(async () => { await S.db.doc("suppliers/" + nid).set(data); await S.db.doc("products/" + id).update({ supplierId: nid }); }, t("linked")) && $("#overlay").innerHTML) productInfoDrawer(id);
  }
  if (f.id === "supplierForm") {
    const data = { name: v("#su-name").trim(), phone: v("#su-phone").trim(), phone2: v("#su-phone2").trim(), independent: v("#su-type") === "alone",
      company: v("#su-company").trim(), visits: v("#su-visits").trim(), address: v("#su-address").trim(), notes: (f.querySelector("#su-notes").value || "").trim() };
    if (!data.name) return;
    if (await write(async () => {
      if (id) await S.db.doc("suppliers/" + id).update(data);
      else { const nid = uid(); await S.db.doc("suppliers/" + nid).set({ id: nid, ...data, createdAt: new Date().toISOString() }); }
    }, t("saved"))) closeDrawer();
  }
  if (f.id === "receiveForm") {
    const p = S.products.get(id); const bx = Math.max(0, Math.round(num(v("#rf-boxes")))); const pc = Math.max(0, Math.round(num(v("#rf-pieces"))));
    const upd = stockBase(p, { closed: num(p.closed) + bx }); const where = v("#rf-where"); upd[where] = num(p[where]) + pc;
    const nc = v("#rf-cost"); if (nc !== "" && nc != null) upd.cost = num(nc);
    if (await write(() => S.db.doc("products/" + id).update(upd), t("received"))) closeDrawer();
  }
  if (f.id === "countForm") {
    const upd = { shelf: Math.max(0, Math.round(num(v("#cf-shelf")))), openBox: Math.max(0, Math.round(num(v("#cf-open")))), closed: Math.max(0, Math.round(num(v("#cf-closed")))), soldBase: num(S.products.get(id)._soldTotal), countedAt: new Date().toISOString() };
    if (await write(() => S.db.doc("products/" + id).update(upd), t("counted"))) closeDrawer();
  }
  if (f.id === "customerForm") {
    const nid = uid(); const name = v("#cu-name").trim(); if (!name) return;
    const staff = f.dataset.kind === "staff";
    const rec = { id: nid, name, phone: v("#cu-phone").trim(), kind: staff ? "staff" : "customer", entries: {} };
    if (staff) rec.role = (v("#cu-role") || "").trim(); else rec.limit = num(v("#cu-limit"));
    if (await write(() => S.db.doc("customers/" + nid).set(rec), t("saved"))) closeDrawer();
  }
  if (f.id === "addDebtForm") {
    const c = S.customers.get(id); let amt = num(v("#ad-amount")); if (amt <= 0) return;
    const cur = v("#ad-cur"); const note = ((v("#ad-note") || "").trim() + (cur === "LBP" ? ` (${lbp(amt)})` : "")).trim();
    if (cur === "LBP") amt = amt / S.settings.rate;
    if (await write(() => addEntry(c, { at: new Date().toISOString(), type: "sale", manual: true, amount: Math.round(amt * 100) / 100, note }), t("debtDone"))) closeDrawer();
  }
  if (f.id === "custPayForm") {
    const c = S.customers.get(id); let amt = num(v("#cp-amount")); if (amt <= 0) return;
    const cur = v("#cp-cur"); const sal = f.querySelector("#cp-salary"); const note = (v("#cp-note") || "").trim() + (cur === "LBP" ? ` (${lbp(amt)})` : "") + (sal && sal.checked ? ` · ${t("fromSalary")}` : "");
    if (cur === "LBP") amt = amt / S.settings.rate;
    if (await write(() => addEntry(c, { at: new Date().toISOString(), type: "pay", amount: Math.round(amt * 100) / 100, note: note.trim() }), t("payDone"))) closeDrawer();
  }
  if (f.id === "paymentForm") {
    const data = { to: v("#py-to").trim(), what: v("#py-what").trim(), amount: num(v("#py-amount")), currency: v("#py-cur"), due: v("#py-due") };
    if (!data.to || data.amount <= 0) return;
    if (await write(async () => {
      if (id) await S.db.doc("payments/" + id).update(data);
      else { const nid = uid(); await S.db.doc("payments/" + nid).set({ id: nid, ...data, paidAt: null, method: null, createdAt: new Date().toISOString() }); }
    }, t("saved"))) closeDrawer();
  }
});

// ---------- connect ----------
render();
(async () => {
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { S.failed = true; render(); return; }
  S.db = db;
  try { const user = await window.claude.use("user"); if (user) { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } } catch (e) {}
  let pending = 6; const done = () => { if (--pending <= 0 && !S.ready) { S.ready = true; render(); return; } if (S.ready) scheduleRender(); else render(); };
  const intoMap = (m) => (snap) => { m.clear(); snap.docs.forEach((d) => m.set(d.id, { ...d.data(), id: d.id })); done(); };
  const onErr = (e) => { console.error(e); done(); };
  db.collection("products").onSnapshot((snap) => {
    S.products.clear();
    snap.docs.forEach((d) => {
      const raw = d.data(); const soldTotal = Object.values(raw.soldBy || {}).reduce((a, b) => a + num(b), 0);
      const since = soldTotal - num(raw.soldBase);
      S.products.set(d.id, { ...raw, ...(since > 0 ? takeFromStock(raw, since) : {}), id: d.id, _soldTotal: soldTotal, _mine: num((raw.soldBy || {})[DEV]) });
    });
    done();
  }, onErr);
  db.collection("customers").onSnapshot(intoMap(S.customers), onErr);
  db.collection("suppliers").onSnapshot(intoMap(S.suppliers), onErr);
  db.collection("payments").onSnapshot(intoMap(S.payments), onErr);
  db.collection("sales").where("date", ">=", addDays(dateKey(), -14)).onSnapshot(intoMap(S.days), onErr);
  db.doc("settings/main").onSnapshot((d) => { if (d.exists) S.settings = { ...S.settings, ...d.data() }; done(); }, onErr);
})();
})();
</script>
